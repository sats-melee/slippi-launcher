name: build

on:
  workflow_dispatch:
  pull_request:
    branches: "**"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  ARENA_COMMIT: 1c4e17e67751a3958f3fc40364bfa47dc5c1018d
  SERVER_COMMIT: 3384425187b945e1b6b7e7e2dca3c4168e739137

jobs:
  build:
    name: Test on node ${{ matrix.node-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.runner || matrix.os }}
    env:
      IS_PR: ${{ github.event_name == 'pull_request' }}
      ENABLE_CODESIGNING_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'enable-codesigning') }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
        python: ["3.11"]
        os: [ubuntu-latest, windows-2022, macOS-latest]
        include:
          - os: ubuntu-latest
            arena_artifact: linux-netplay
            server_artifact: sats-arena-server-linux-x86_64
          - os: windows-2022
            arena_artifact: windows-netplay
            server_artifact: sats-arena-server-windows-x86_64
          - os: macOS-latest
            runner: macos-15-intel
            arena_artifact: macOS-netplay
            server_artifact: sats-arena-server-macos-x86_64

    steps:
      - name: Use Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Test release artifact selection
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_artifacts.py'
          python3 -m unittest discover -s scripts -p 'test_check_bundled_runtime.py'

      - name: Install Node.js and npm
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            release/app/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'release/app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-${{ matrix.node-version }}-

      - name: Cache npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ${{ runner.os == 'Windows' && '~/AppData/Local/electron/Cache' || '' }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'release/app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-${{ matrix.node-version }}-

      - name: Install dependencies
        run: |
          npm install

      # Addresses the Electron binary installation issue
      # https://github.com/electron/electron/issues/51619#issuecomment-4521813516
      - name: Ensure Electron binary is installed
        run: node node_modules/electron/install.js
      
      - name: Load Windows signing secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        if: matrix.os == 'windows-2022' && (env.AZURE_CLIENT_ID != null || env.IS_PR == 'true')
        shell: bash
        run: |
          # Enable signing if: (1) PR with enable-codesigning label, OR (2) not a PR and release commit
          if [[ "$IS_PR" = "true" ]]; then
            if [[ "$ENABLE_CODESIGNING_LABEL" = "true" ]]; then
              echo "PR with enable-codesigning label, enabling code signing"
            else
              echo "PR without enable-codesigning label, skipping code signing"
              exit 0;
            fi
          else
            msg="$(git log -1 --no-merges --pretty=%B | head -n 1)"
            if [[ ! "$msg" =~ ^release:.* ]]; then
              echo "not a release commit, skipping code signing"
              exit 0;
            fi
          fi
          echo "SLIPPI_ENABLE_SIGNING=yes" >> $GITHUB_ENV
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "signing enabled and secrets loaded"

      # electron-builder signs unconditionally whenever win.azureSignOptions is present,
      # so strip that block when signing is disabled (fork PRs, non-release commits).
      - name: Disable Windows signing
        if: matrix.os == 'windows-2022' && env.SLIPPI_ENABLE_SIGNING != 'yes'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const f = 'electron-builder.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            delete c.win.azureSignOptions;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          "
          echo "removed win.azureSignOptions; this build will be unsigned"

      - name: Load macOS signing certificates and secrets
        if: matrix.os == 'macOS-latest' && env.CERTIFICATE_MACOS_PASSWORD != null && (env.IS_PR != 'true' || env.ENABLE_CODESIGNING_LABEL == 'true')
        run: |
          chmod +x .erb/scripts/load-macos-certs-ci.sh && ./.erb/scripts/load-macos-certs-ci.sh
          mkdir -p ~/private_keys/
          echo "SLIPPI_ENABLE_SIGNING=true" >> $GITHUB_ENV
          echo '${{ secrets.APPLE_CONNECT_API_KEY }}' > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          echo "CSC_KEYCHAIN=$HOME/Library/Keychains/build.keychain-db" >> $GITHUB_ENV
          echo "APPLE_API_KEY=~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8" >> $GITHUB_ENV
          echo "APPLE_API_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}" >> $GITHUB_ENV
          echo "APPLE_API_ISSUER=${{ secrets.APPLE_ISSUER_ID }}" >> $GITHUB_ENV
          echo "APPLE_TEAM_PROVIDER_ID=${{ secrets.APPLE_TEAM_PROVIDER_ID }}" >> $GITHUB_ENV
        env:
          CERTIFICATE_MACOS_APPLICATION: ${{ secrets.CERTIFICATE_MACOS_APPLICATION }}
          CERTIFICATE_MACOS_PASSWORD: ${{ secrets.CERTIFICATE_MACOS_PASSWORD }}

      # The packaged launcher embeds the native Arena game (built in the
      # Ishiiruka repo) and the arena server (from the sats-arena repo).
      - name: Fetch native Arena runtime
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{ secrets.CROSS_REPO_TOKEN }}
          repo: sats-melee/Ishiiruka
          workflow: pr-build.yml
          commit: ${{ env.ARENA_COMMIT }}
          event: push
          workflow_conclusion: success
          name: ${{ matrix.arena_artifact }}
          path: native-dist

      - name: Fetch sats-arena server
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{ secrets.CROSS_REPO_TOKEN }}
          repo: sats-melee/sats-arena
          workflow: ci.yml
          commit: ${{ env.SERVER_COMMIT }}
          event: push
          workflow_conclusion: success
          name: ${{ matrix.server_artifact }}
          path: server-dist

      - name: Stage native Arena runtime (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          unzip -q native-dist/*-linux-netplay.zip -d native-dist
          chmod +x native-dist/Sats-Arena-x86_64.AppImage
          (cd native-dist && ./Sats-Arena-x86_64.AppImage --appimage-extract >/dev/null)
          python3 scripts/stage-native.py --appimage-dir native-dist/squashfs-root
          install -m 0755 server-dist/sats-arena-server assets/include/sats-arena/sats-arena-server

      - name: Stage native Arena runtime (Windows)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          mkdir -p assets/include/sats-arena
          7z x -y native-dist/*.zip -o"$RUNNER_TEMP/arena-win" >/dev/null
          cp "$RUNNER_TEMP/arena-win/Slippi Dolphin.exe" assets/include/sats-arena/dolphin-emu.exe
          cp "$RUNNER_TEMP/arena-win/sats-arena-wallet-check.exe" assets/include/sats-arena/
          cp "$RUNNER_TEMP/arena-win/"*.dll assets/include/sats-arena/
          cp -r "$RUNNER_TEMP/arena-win/Sys" assets/include/sats-arena/Sys
          cp server-dist/sats-arena-server.exe assets/include/sats-arena/

      - name: Stage native Arena runtime (macOS)
        if: matrix.os == 'macOS-latest'
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/arena-dmg native-dist/*.dmg
          mkdir -p assets/include/sats-arena
          cp -R "/tmp/arena-dmg/Slippi Dolphin.app" assets/include/sats-arena/
          hdiutil detach /tmp/arena-dmg
          cp server-dist/sats-arena-server assets/include/sats-arena/
          chmod +x assets/include/sats-arena/sats-arena-server

      - name: Check staged runtime architecture and executables
        run: python scripts/check-bundled-runtime.py assets/include/sats-arena

      - name: Build App
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          printf '%s\n' "$ENVFILE" > .env
          npm run package
        env:
          ENVFILE: ${{ secrets.ENVFILE }}
          NODE_OPTIONS: "--max-old-space-size=8192"
          USE_HARD_LINKS: false # because of https://github.com/electron-userland/electron-builder/issues/3179
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_FOR_PULL_REQUEST: ${{ env.IS_PR != 'true' || env.ENABLE_CODESIGNING_LABEL == 'true' }}
      - name: Check runtime extracted from Linux installer
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          release_version=$(node -p 'require("./release/app/package.json").version')
          package="$GITHUB_WORKSPACE/release/build/Slippi-Launcher-$release_version-x86_64.AppImage"
          chmod +x "$package"
          mkdir -p "$RUNNER_TEMP/launcher-install"
          (cd "$RUNNER_TEMP/launcher-install" && "$package" --appimage-extract >/dev/null)
          python scripts/check-bundled-runtime.py "$RUNNER_TEMP/launcher-install/squashfs-root/resources/assets/include/sats-arena"
      - name: Check runtime extracted from Windows installer
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          release_version=$(node -p 'require("./release/app/package.json").version')
          7z x -y "release/build/Slippi-Launcher-Setup-$release_version.exe" -o"$RUNNER_TEMP/launcher-install" >/dev/null
          7z x -y "$RUNNER_TEMP/launcher-install/\$PLUGINSDIR/app-64.7z" -o"$RUNNER_TEMP/launcher-app" >/dev/null
          python scripts/check-bundled-runtime.py "$RUNNER_TEMP/launcher-app/resources/assets/include/sats-arena"
      - name: Check runtime extracted from macOS installer and updater
        if: matrix.os == 'macOS-latest'
        shell: bash
        run: |
          release_version=$(node -p 'require("./release/app/package.json").version')
          hdiutil attach -nobrowse -mountpoint /tmp/launcher-dmg "release/build/Slippi-Launcher-$release_version-x64.dmg"
          python scripts/check-bundled-runtime.py "/tmp/launcher-dmg/Slippi Launcher.app/Contents/Resources/assets/include/sats-arena"
          hdiutil detach /tmp/launcher-dmg
          mkdir -p "$RUNNER_TEMP/launcher-updater"
          ditto -x -k "release/build/Slippi-Launcher-$release_version-x64-mac.zip" "$RUNNER_TEMP/launcher-updater"
          python scripts/check-bundled-runtime.py "$RUNNER_TEMP/launcher-updater/Slippi Launcher.app/Contents/Resources/assets/include/sats-arena"
      - name: Run tests
        run: |
          npm run typecheck
          npm run test
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run lint
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir artifacts
          mv release/build/{*.exe*,*.deb,*.AppImage,*.dmg*,*.zip,*.yml} artifacts || true
          release_version=$(node -p 'require("./release/app/package.json").version')
          case "$RUNNER_OS" in
            Linux)
              test -s "artifacts/Slippi-Launcher-$release_version-x86_64.AppImage"
              test -s artifacts/latest-linux.yml
              ;;
            Windows)
              test -s "artifacts/Slippi-Launcher-Setup-$release_version.exe"
              test -s artifacts/latest.yml
              ;;
            macOS)
              test -s "artifacts/Slippi-Launcher-$release_version-x64.dmg"
              test -s "artifacts/Slippi-Launcher-$release_version-x64-mac.zip"
              test -s artifacts/latest-mac.yml
              ;;
          esac
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.os}}
          path: artifacts
          if-no-files-found: error
