name: Upload Latest Artifacts to Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate or repair
        required: true
        type: string
      build_run_id:
        description: Optional successful build run for the same tag commit
        required: false
        type: string
      upload:
        description: Upload assets to the existing release (false only validates)
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Release Launcher
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select the successful build of the exact tag commit
        id: source
        shell: bash
        run: |
          args=(--tag "$RELEASE_TAG")
          if [[ -n "$BUILD_RUN_ID" ]]; then args+=(--run-id "$BUILD_RUN_ID"); fi
          python3 scripts/release-artifacts.py resolve "${args[@]}"
      - name: Download the selected artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          artifact-ids: ${{ steps.source.outputs.artifact_ids }}
          path: release-artifacts
      - name: Validate and stage release assets
        env:
          APP_VERSION: ${{ steps.source.outputs.version }}
        run: |
          python3 scripts/release-artifacts.py stage --downloads release-artifacts --output release-assets --version "$APP_VERSION"
      - name: Upload to the existing release
        if: github.event_name == 'release' || inputs.upload
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" -- "$RELEASE_TAG" >/dev/null
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" release-assets/*
      - name: Record release source
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
          BUILD_ID: ${{ steps.source.outputs.run_id }}
        run: |
          {
            printf 'Tag: `%s`\n\nCommit: `%s`\n\n' "$RELEASE_TAG" "$BUILD_SHA"
            printf 'Build: https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$BUILD_ID"
            printf 'Assets:\n'
            find release-assets -maxdepth 1 -type f -printf '\n- %f\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"
